<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bb-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#185844"/>
      <stop offset="100%" stop-color="#102F27"/>
    </linearGradient>
    <linearGradient id="bb-inner" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B08A4F"/>
      <stop offset="100%" stop-color="#78947F"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Shield / Focus Ring -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#102F27" stroke="#B08A4F" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Outer Focus Aperture Target -->
  <circle cx="24" cy="24" r="14" stroke="#78947F" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Center Focus Core Play/Shield Point -->
  <circle cx="24" cy="24" r="7" fill="#185844" stroke="#B08A4F" stroke-width="1.5"/>
  <polygon points="22,20.5 28,24 22,27.5" fill="#F2EBDD"/>
</svg>
